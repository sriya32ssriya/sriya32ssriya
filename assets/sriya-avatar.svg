<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="10 60 380 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0080"/><stop offset="0.55" stop-color="#7928ca"/><stop offset="1" stop-color="#00dfd8"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="200" cy="250" r="190"/></clipPath>
    <clipPath id="top"><path d="M88 480 C92 385 135 347 200 345 C265 347 308 385 312 480 Z"/></clipPath>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f2c09c"/><stop offset="1" stop-color="#e2a57f"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="250" r="190" fill="url(#bg)"/>

  <g clip-path="url(#circle)">
    <!-- back hair -->
    <path d="M200 66 C108 66 82 150 88 232 C92 300 64 350 78 440 L322 440 C336 350 308 300 312 232 C318 150 292 66 200 66 Z" fill="#16161d"/>

    <!-- neck -->
    <rect x="176" y="292" width="48" height="66" rx="14" fill="#d79c77"/>

    <!-- striped top -->
    <path d="M88 480 C92 385 135 347 200 345 C265 347 308 385 312 480 Z" fill="#f7f4ee"/>
    <g clip-path="url(#top)" fill="#1f2a5a">
      <rect x="80" y="368" width="240" height="11"/>
      <rect x="80" y="398" width="240" height="11"/>
      <rect x="80" y="428" width="240" height="11"/>
    </g>
    <!-- v-neck -->
    <path d="M176 345 L200 385 L224 345 Z" fill="#e2a57f"/>
    <path d="M172 343 L200 391 L228 343" fill="none" stroke="#1f2a5a" stroke-width="5" stroke-linejoin="round"/>

    <!-- face -->
    <ellipse cx="200" cy="222" rx="68" ry="84" fill="url(#skin)"/>

    <!-- front hair curtains -->
    <path d="M200 90 C148 92 124 132 127 200 C129 262 116 305 114 360 C112 405 122 440 132 480 L162 480 C142 430 139 385 141 335 C141 272 138 205 155 150 C172 120 188 104 200 98 Z" fill="#16161d"/>
    <path d="M200 90 C252 92 276 132 273 200 C271 262 284 305 286 360 C288 405 278 440 268 480 L238 480 C258 430 261 385 259 335 C259 272 262 205 245 150 C228 120 212 104 200 98 Z" fill="#16161d"/>
    <!-- hair cap -->
    <path d="M126 178 C122 100 162 66 200 66 C238 66 278 100 274 178 C258 124 228 100 200 100 C172 100 142 124 126 178 Z" fill="#16161d"/>
    <!-- hair shine -->
    <g fill="none" stroke="#3d3d55" stroke-width="4" stroke-linecap="round">
      <path d="M160 96 C145 110 136 130 133 150"/>
      <path d="M240 96 C255 110 264 130 267 150"/>
      <path d="M126 300 C122 330 122 360 126 395"/>
      <path d="M276 290 C280 320 281 350 277 380"/>
      <path d="M100 250 C96 290 94 320 98 360"/>
      <path d="M302 250 C306 290 306 320 302 360"/>
    </g>

    <!-- eyebrows -->
    <g fill="none" stroke="#2a1a14" stroke-width="5" stroke-linecap="round">
      <path d="M158 190 Q174 181 190 188"/>
      <path d="M210 188 Q226 181 242 190"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="175" cy="211" rx="14" ry="9.5" fill="#ffffff"/>
      <ellipse cx="225" cy="211" rx="14" ry="9.5" fill="#ffffff"/>
      <circle cx="177" cy="211" r="8" fill="#4a2a1a"/>
      <circle cx="227" cy="211" r="8" fill="#4a2a1a"/>
      <circle cx="177" cy="211" r="4.5" fill="#120a06"/>
      <circle cx="227" cy="211" r="4.5" fill="#120a06"/>
      <circle cx="180" cy="208" r="2.2" fill="#ffffff"/>
      <circle cx="230" cy="208" r="2.2" fill="#ffffff"/>
      <path d="M160 208 Q175 197 190 207" fill="none" stroke="#1a1010" stroke-width="3" stroke-linecap="round"/>
      <path d="M210 207 Q225 197 240 208" fill="none" stroke="#1a1010" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- blink -->
    <g opacity="0">
      <ellipse cx="175" cy="210" rx="16" ry="12" fill="#ecb490"/>
      <ellipse cx="225" cy="210" rx="16" ry="12" fill="#ecb490"/>
      <path d="M161 212 Q175 219 189 212" fill="none" stroke="#1a1010" stroke-width="3" stroke-linecap="round"/>
      <path d="M211 212 Q225 219 239 212" fill="none" stroke="#1a1010" stroke-width="3" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.93;0.965;1" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- bottu -->
    <circle cx="200" cy="183" r="2.8" fill="#111111"/>

    <!-- nose -->
    <path d="M201 222 Q197 242 192 248 Q200 254 208 248" fill="none" stroke="#c4845f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- blush -->
    <ellipse cx="158" cy="248" rx="13" ry="7" fill="#f28c95" opacity="0.45"/>
    <ellipse cx="242" cy="248" rx="13" ry="7" fill="#f28c95" opacity="0.45"/>

    <!-- soft smile -->
    <path d="M181 268 Q200 284 219 268" fill="none" stroke="#b44f5d" stroke-width="4" stroke-linecap="round"/>
    <path d="M186 271 Q200 281 214 271" fill="#d9707f" opacity="0.35"/>
  </g>
</svg>
